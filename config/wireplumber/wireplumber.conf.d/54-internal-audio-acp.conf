# Re-enable ACP automatic profile selection for the laptop's own built-in
# audio cards (Radeon + Ryzen HD Audio Controllers, same PCI device,
# functions .1 and .6) ONLY.
#
# ACP is disabled globally (pipewire.conf.d/disable-acp.conf — kept for the
# DJ-808). Without ACP, no output profile gets auto-selected for these
# cards at boot, so no sink node is ever created for the laptop speakers —
# the HDB 630 hearing aid then looks like it "takes over" audio output
# whenever it's connected, when really it's the only sink that exists.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.pci-0000_c4_00\\..*" }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp     = true
        api.acp.auto-profile = true
      }
    }
  }
]
