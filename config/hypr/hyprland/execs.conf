# Bar, wallpaper
exec-once = ~/.config/hypr/hyprland/scripts/start_geoclue_agent.sh
# Wrapper waits for the Wayland socket first — starting qs before the compositor
# is listening made Qt abort in platform init, once per login (see the script).
exec-once = ~/.config/hypr/hyprland/scripts/start-quickshell.sh $qsConfig
exec-once = ~/.config/hypr/custom/scripts/__restore_video_wallpaper.sh

# Core components (authentication, lock screen, notification daemon)
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = hypridle
exec-once = dbus-update-activation-environment --all
# Display vars for systemd, and a portal that started without them restarted (else
# "Open With" from Telegram etc. starts apps with no display: nothing opens)
exec-once = sleep 1 && ~/.scripts/portal-env-fix

# Audio
exec-once = easyeffects --hide-window --service-mode

# Clipboard: history
# exec-once = wl-paste --watch cliphist store &
# One supervisor runs BOTH watchers and restarts either if it dies. Keeping
# them under a single process preserves the `pgrep -x wl-paste` name guard —
# a per-type guard would need `pgrep -f`, which matches the launching sh -c
# and would stop both from ever starting.
exec-once = ~/.config/hypr/hyprland/scripts/start-cliphist-watch.sh $qsConfig

# Cursor — left for KDE settings to control via kdeglobals.
# (Was: exec-once = hyprctl setcursor Bibata-Modern-Classic 24 —
#  hardcoded Bibata overrode whatever the user picked in KDE
#  System Settings every login.)

# Fix dock pinned apps not launching properly (https://github.com/end-4/dots-hyprland/issues/2200)
# This causes https://github.com/end-4/dots-hyprland/issues/2427
# exec-once = sleep 3.5 && hyprctl reload && sleep 0.5 && touch ~/.config/quickshell/ii/shell.qml
