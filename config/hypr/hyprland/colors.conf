general {
    col.active_border = rgba(3a494e77)
    col.inactive_border = rgba(141d1f33)
}

misc {
    background_color = rgba(0c1517FF)
}

plugin {
    hyprbars {
        bar_height = 28
        bar_padding = 12
        bar_button_padding = 6
        bar_precedence_over_border = true
        bar_part_of_window = true
        bar_buttons_alignment = left
        icon_on_hover = true

        bar_color = rgb(0c1517)
        col.text = rgb(dbe4e7)

        # macOS Traffic Light Buttons (Red Close, Yellow Minimize, Green Fullscreen)
        hyprbars-button = rgb(ff5f56), 12,  , killactive
        hyprbars-button = rgb(ffbd2e), 12,  , movetoworkspacesilent special
        hyprbars-button = rgb(27c93f), 12,  , fullscreen 1
    }
}

windowrule = border_color rgba(f1bf61AA) rgba(f1bf6177), match:pin 1
