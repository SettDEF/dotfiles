# AwesomeWM-style layouts: lua/awesome_layouts.lua, loaded from lua/local.lua.
# Its keys (Super+Y next layout, Super+Alt+H/L master width, Super+Alt+Shift+H/L
# masters, Super+Alt+Ctrl+H/L columns, Super+Ctrl+Return swap master) are bound
# there, as Lua functions: they pick the right command for the workspace's
# layout, which a converted .conf bind cannot do.
