# Terminal launches are now defined in hyprland/keybinds.conf with the run-first chain.

# ── Tor utilities ──────────────────────────────────────────────────────────
# Super+Shift+T : open a tor-routed zash session (tmux loads ~/.config/tmux/tor.conf)
# Super+Shift+I : rotate Tor circuit / identity (SIGNAL NEWNYM via control port 9051)
# Super+Alt+T   : toggle tor.service (start if stopped, stop if running) with notification
bind = SUPER SHIFT, O, exec, $HOME/.local/bin/zash -- tmux -f ~/.config/tmux/tor.conf new-session
bind = SUPER SHIFT, I, exec, bash -c 'if printf "AUTHENTICATE \"\"\nSIGNAL NEWNYM\nQUIT\n" | nc -q1 127.0.0.1 9051 2>/dev/null | grep -q 250; then notify-send -i security-high "Tor" "Identity rotated"; else notify-send -u critical -i security-low "Tor" "Failed to rotate (control port unreachable)"; fi'
bind = SUPER ALT, T, exec, bash -c 'if systemctl is-active --quiet tor; then pkexec systemctl stop tor && notify-send -i security-low "Tor" "Service stopped"; else pkexec systemctl start tor && notify-send -i security-high "Tor" "Service started"; fi'

