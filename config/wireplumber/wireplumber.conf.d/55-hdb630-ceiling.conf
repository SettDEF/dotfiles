# Take the HDB 630's hardware volume out of PipeWire's hands.
#
# The headset's ALSA "PCM" control has sixteen steps of 3 dB: step 15 is 0 dB
# and a normal listening level here is step 12 (-9 dB). With PipeWire driving
# that control directly, every slider move jumps in 3 dB stairs AND the device
# keeps 9 dB of headroom above where you listen — so any burst of noise, from
# whatever source, lands far louder than your music ever does.
#
# soft-mixer makes PipeWire attenuate in software and never touch the hardware
# control. ~/.scripts/apps/hdb630/hdb630-guard.sh then pins that control at step 12, which
# becomes a fixed analogue ceiling. Raise it with HDB630_PIN if you need more.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-Sonova_Consumer_Hearing_HDB_630.*" }
      { node.name   = "~alsa_output.usb-Sonova_Consumer_Hearing_HDB_630.*" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
