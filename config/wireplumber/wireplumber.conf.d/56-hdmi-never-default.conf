# The Radeon's HDMI/DisplayPort audio (pci-0000_c4_00.1) must never win the
# default-output election just by being plugged in.
#
# Measured with pw-dump: its Pro Audio sinks come up at priority.session
# 1100-1196, ABOVE the internal speakers (1009). So every time the dock or a
# monitor was re-plugged, WirePlumber promoted the new HDMI sink to default
# whenever the usual device was not present, and the audio moved to a screen.
# Dropped to 50 it is still a fallback when nothing else exists, but it loses
# every election it used to win. Deliberately choosing it still works: a chosen
# default is remembered and outranks priority.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.pci-0000_c4_00\\.1\\..*" }
    ]
    actions = {
      update-props = {
        priority.driver  = 50
        priority.session = 50
      }
    }
  }
]
