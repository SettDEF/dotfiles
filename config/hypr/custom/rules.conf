# You can put custom rules here
# Window/layer rules: https://wiki.hyprland.org/Configuring/Window-Rules/
# Workspace rules: https://wiki.hyprland.org/Configuring/Workspace-Rules/

# ######## Window rules ########

# GIMP: Dialoge als floating damit sie Fokus bekommen (behebt SVG-Import-Bug)
windowrulev2 = float, class:^(gimp.*)$, title:^(?!.*GIMP).*$
windowrulev2 = stayfocused, class:^(gimp.*)$, title:^(?!.*GIMP).*$

# KIO properties dialog (skwd's "Properties…" context-menu entry): floating
# popup, centred — it is a dialog, not a window to tile.
# Note the 0.55 rule grammar (`match:… , prop on`); windowrulev2 is ignored.
windowrule = match:class ^(org\.kde\.kioclient)$, float on
windowrule = match:class ^(org\.kde\.kioclient)$, center on
windowrule = match:class ^(org\.kde\.kioclient)$, size (monitor_w*.34) (monitor_h*.72)

# MiniMeters: Pinned floating overlay at the bottom (allows live resizing with Super + Right-Click drag)
windowrulev2 = float, class:.*[Mm]inimeters.*
windowrulev2 = pin, class:.*[Mm]inimeters.*
windowrulev2 = noinitialfocus, class:.*[Mm]inimeters.*
windowrulev2 = noborder, class:.*[Mm]inimeters.*
windowrulev2 = noshadow, class:.*[Mm]inimeters.*
windowrulev2 = noblur, class:.*[Mm]inimeters.*

# (Wezterm rule removed — fullscreenstate was preventing window mapping.)

# Uncomment to apply global transparency to all windows:
# windowrule = opacity 0.89 override 0.89 override, match:class .*

# Disable blur for all xwayland apps
# windowrule = no_blur on, match:xwayland 1
device {
    name = elan9008:00-04f3:43c7-stylus
    output = eDP-1
    # Try forcing left-handed or other modes sometimes helps quirky ELAN
    left_handed = false
}

# Global tablet/tool tweaks (newer Hyprland supports these)
input {
    # Sometimes helps emulated clicks on tablets
    touchpad {
        tap-to-click = true   # ← try this even though it's stylus, some ELAN need it
    }
    # If you have this section, ensure no conflicting mouse/tablet emulation
}

# MiniMeters must claim the top strip BEFORE the bar does.
#
# Both are top-layer surfaces. Layout runs in list order and each exclusive
# zone pushes the ones after it down, so with the bar first MiniMeters landed
# at y=40, under it. A higher order puts MiniMeters first: it takes y=0 and
# the bar sits below it. This lived only in the generated lua and was lost
# when rules.lua was regenerated on 2026-09-20 — keep it in the source.
layerrule = match:namespace MiniMeters, order 1

# Dock widget windows are small floating panels, not tiles. Matched on TITLE
# as well as class — org.quickshell alone would also float the settings window
# and the detached sidebar.
windowrule = match:class ^(org\.quickshell)$, match:title (.*)— Dock$, float on

# Slipmat's window is an app window, not a tile in the layout. Matched on
# title, same as the dock widget windows above.
windowrule = match:class ^(org\.quickshell|kalends)$, match:title ^Kalends$, float on
windowrule = match:class ^(org\.quickshell|kalends)$, match:title ^Kalends$, size 900 620
windowrule = match:class ^(org\.quickshell|kalends)$, match:title ^Kalends$, center on

# Bar hover popups: no compositor animation. Each popup is its own layer
# surface, so moving along the bar faded the old one out while the next faded
# in, and the two overlapped. The popup fades itself in (StyledPopup.qml) and
# vanishes at once, so a hand-over is a clean swap.
layerrule = match:namespace quickshell:popup, no_anim on

# zash --desktop: the terminal on the wallpaper. The wallpaper behind it is blurred; its panel
# (as dark as zash measures the wallpaper needs) sits on the blur, so the text stays readable.
layerrule = match:namespace zash-desktop, blur on
layerrule = match:namespace zash-desktop, ignore_alpha 0
layerrule = match:namespace zash-desktop, no_anim on

# zash --float: a floating terminal at the size it asks for, centred.
windowrule = match:class ^(zash-float)$, float on
windowrule = match:class ^(zash-float)$, center on

# reel on a picture (title "name.png — reel"): floats over what you were doing, centred, instead of tiling in.
windowrule = match:class ^(reel)$, match:title (?i).*\.(png|jpe?g|webp|gif|avif|hei[cf]|jxl|tiff?|bmp|svg|ico|psd|xcf|kra|exr|qoi|tga|jp2|dng|cr[23]|nef|arw|raf)\s—\sreel$, float on
windowrule = match:class ^(reel)$, match:title (?i).*\.(png|jpe?g|webp|gif|avif|hei[cf]|jxl|tiff?|bmp|svg|ico|psd|xcf|kra|exr|qoi|tga|jp2|dng|cr[23]|nef|arw|raf)\s—\sreel$, center on
windowrule = match:class ^(reel)$, match:title (?i).*\.(png|jpe?g|webp|gif|avif|hei[cf]|jxl|tiff?|bmp|svg|ico|psd|xcf|kra|exr|qoi|tga|jp2|dng|cr[23]|nef|arw|raf)\s—\sreel$, size (monitor_w*.70) (monitor_h*.80)
