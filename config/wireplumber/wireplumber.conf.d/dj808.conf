monitor.alsa.rules = [
  {
    matches = [
      { alsa.card_name = "DJ-808" }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp       = true
        device.profile         = "pro-audio"
        node.description       = "DJ-808 Playback"
        audio.rate             = 48000
        audio.channels         = 12
        audio.position         = "FL,FR,FC,LFE,RL,RR,FLC,FRC,RC,SL,SR,TC"
        api.alsa.period-size   = 256
      }
    }
  }
]
