# Hyprland executes exec-once (and systemd sees WAYLAND_DISPLAY) a moment before
# the compositor actually accepts wayland clients. Stock unit retries 3x within
# ~40ms, hits the start limit and stays dead for the whole session. Space the
# retries so a slow compositor start is survivable.
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=10

[Service]
RestartSec=2
