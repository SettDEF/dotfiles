# This file sources other files in `hyprland` and `custom` folders
# You wanna add your stuff in files in `custom`

# --- Environment variables ---
source=hyprland/env.conf
# hyprlang noerror true
source=custom/env.conf
# hyprlang noerror false

# --- Other vars ---
source=hyprland/variables.conf
# hyprlang noerror true
source=custom/variables.conf
# hyprlang noerror false

# --- Defaults ---
# hyprlang if !dontLoadDefaultExecs
source=hyprland/execs.conf
# hyprlang endif
# hyprlang if !dontLoadDefaultGeneral
source=hyprland/general.conf
# hyprlang endif
# hyprlang if !dontLoadDefaultRules
source=hyprland/rules.conf
# hyprlang endif
# hyprlang if !dontLoadDefaultColors
source=hyprland/colors.conf
# hyprlang endif
# hyprlang if !dontLoadDefaultKeybinds
source=hyprland/keybinds.conf
# hyprlang endif
source=hyprland/layouts.conf

# --- Custom ---
# hyprlang noerror true
source=custom/execs.conf
# hyprlang noerror true
source=custom/general.conf
# hyprlang noerror true
source=custom/rules.conf
# hyprlang noerror true
source=custom/keybinds.conf
# hyprlang noerror false

# --- nwg-displays support ---
source=workspaces.conf
source=monitors.conf

# --- Shell overrides ---
source=hyprland/shellOverrides/main.conf
# Keyboard repeat/numlock/resolve-by-sym from the Quickshell OSK "tune" panel.
# Separate file so a layout change (which rewrites main.conf) can't wipe it.
source=hyprland/shellOverrides/keyboard.conf

xwayland {
    force_zero_scaling = true
}
source=custom/touchpad-accel.conf

# ── Wove Meters: dock it to the top edge ──────────────────────────────────────
# Wayland does not let a client position its own window, so the app's own Dock
# buttons cannot work here — that is the compositor's rule, not a bug in Wove.
# Hyprland CAN place it, so the rules live here instead.
#
# Sized in PERCENT, not pixels. This said `size 1532 180`, where 1532 was the
# logical screen width at scale 1.67 — so changing the scale to 1.6 (which made
# the panel 1600 wide) left the window 68px short, with nothing to say why.
# `100%` is the same intent without a number that goes stale.
# `move 0 40` stays absolute: 40 is the bar's height, not a fraction of
# anything. Delete this whole block to undo. `hyprctl reload` applies changes.
windowrule = float,      class:^(wove-meters)$
windowrule = size 100% 180, class:^(wove-meters)$
windowrule = move 0 40,  class:^(wove-meters)$
windowrule = pin,        class:^(wove-meters)$
# the mini player: mpv --wayland-app-id=mpv-mini (fileportal, share "Play small"); loom reads these lines
windowrule = float,      class:^(mpv-mini)$
windowrule = size 25% 25%, class:^(mpv-mini)$
windowrule = move (monitor_w*.375) (monitor_h*.72), class:^(mpv-mini)$
windowrule = pin,        class:^(mpv-mini)$
windowrule = noinitialfocus, class:^(mpv-mini)$
windowrule = noborder,   class:^(wove-meters)$
