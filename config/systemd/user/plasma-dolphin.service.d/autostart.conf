# Start Dolphin's FileManager1 daemon at login.
#
# WHY
# org.freedesktop.FileManager1 is an EXCLUSIVE D-Bus name: whoever claims it
# first keeps it. Nautilus claims it on startup, so once anything started GNOME
# Files (xdg-desktop-portal-gnome, which lutris/niri/gnome-session require and
# which therefore cannot be uninstalled), every subsequent "open containing
# folder" went to Nautilus for as long as it stayed alive -- regardless of the
# service files or mimeapps.
#
# Blocking Nautilus outright was the wrong fix: overriding org.gnome.Nautilus
# meant nothing opened at all, because callers waiting on that name just failed.
# Owning the name first is non-destructive -- Nautilus still runs when something
# genuinely wants it, it simply cannot take FileManager1 off Dolphin.
#
# The unit ships static (no [Install]), which is why nothing ever started it.
[Install]
WantedBy=graphical-session.target
