# Managed by Quickshell — the OSK "Keyboard settings" (tune) panel writes here.
# Sourced after hyprland/general.conf, so any key set below overrides the
# defaults there and persists across reboots. Only keys you actually change in
# the panel appear here; everything else keeps the general.conf default.
# Flat `input:key = value` lines are used so the panel can upsert one at a time.
input:repeat_delay = 150
input:repeat_rate = 65
