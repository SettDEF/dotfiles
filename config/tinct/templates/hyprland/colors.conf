general {
    col.active_border = rgba({{colors.outline_variant.default.hex_stripped}}77)
    col.inactive_border = rgba({{colors.surface_container_low.default.hex_stripped}}33)
}

misc {
    background_color = rgba({{colors.surface.dark.hex_stripped}}FF)
}

plugin {
    hyprbars {
        bar_height = 28
        bar_padding = 12
        bar_button_padding = 6
        bar_precedence_over_border = true
        bar_part_of_window = true
        bar_buttons_alignment = left
        icon_on_hover = true

        bar_color = rgb({{colors.background.default.hex_stripped}})
        col.text = rgb({{colors.on_background.default.hex_stripped}})

        # macOS Traffic Light Buttons (Red Close, Yellow Minimize, Green Fullscreen)
        hyprbars-button = rgb(ff5f56), 12,  , killactive
        hyprbars-button = rgb(ffbd2e), 12,  , movetoworkspacesilent special
        hyprbars-button = rgb(27c93f), 12,  , fullscreen 1
    }
}

windowrule = border_color rgba({{colors.primary.default.hex_stripped}}AA) rgba({{colors.primary.default.hex_stripped}}77), match:pin 1
