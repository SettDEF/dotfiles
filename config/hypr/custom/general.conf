# Put general config stuff here
# Here's a list of every variable: https://wiki.hyprland.org/Configuring/Variables/

# monitor=,addreserved, 0, 0, 0, 0 # Custom reserved area

# HDMI port: mirror display. To see device name, use `hyprctl monitors`

general {
    # The real default is set in lua/local.lua: lua:awesomewm (AwesomeWM-style
    # layouts) has to be registered first, and this file loads before it.
    general {
    layout = master
}

# NOTE: `input { mouse_refocus = false }` was removed — it stopped keyboard
# focus from following to the window on the new workspace when switching
# workspaces, so you couldn't type until clicking. Default behaviour restored.

# Re-assert keyboard focus after every config reload. Reloading Hyprland (or
# Quickshell) churns layer-shell surfaces and can leave focus dropped — you
# couldn't type until switching workspaces. `exec` (not exec-once) re-runs on
# each reload, so this hands focus back automatically.
exec = ~/.config/hypr/hyprland/scripts/refocus.sh


# ─── hyprbars windowrules removed ─────────────────────────────────────
# hyprbars 1.0 (upstream Vaxry) is incompatible with Hyprland 0.55's new
# windowrule API — `plugin:hyprbars:nobar` errors "invalid field type" no
# matter what value is passed. There's currently no way to make hyprbars
# decorate only specific windows. Waiting for the plugin to update.
# (Reach back to this file once hyprbars releases a 0.55-compatible
#  build; restore the two-rule opt-out for class:^firefox$ + PiP title.)

input {
    touchpad {
        natural_scroll = true
    }
}

# the Z13's touchpad scrolls faster; only this device (as input:scroll_factor it went to every
# machine these dotfiles install on, and doubled a small touchpad's scrolling)
device {
    name = asustek-computer-inc.-gz302ea-keyboard-touchpad
    scroll_factor = 1.5
}

animations {
    # Override sliding workspaces with a clean fade/crossfade transition
    # to fix visual sub-pixel offset glitches under fractional scaling
    animation = workspaces, 1, 5, menu_decel, fade
}

