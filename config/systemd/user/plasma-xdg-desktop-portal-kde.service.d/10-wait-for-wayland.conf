# The shipped unit orders itself After=plasma-core.target, which never becomes
# meaningful in a Hyprland session — so the portal races the compositor and dies
# with "Failed to create wl_display (Connection refused)" -> Qt qFatal -> SIGABRT,
# then stays failed for the whole session (breaking portal file pickers and
# screen sharing).
#
# Two belts: wait for the Wayland socket to exist before starting, and retry if
# it still loses the race.
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=10

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 100); do [ -S "${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}" ] && exit 0; sleep 0.1; done; exit 0'
Restart=on-failure
RestartSec=2
