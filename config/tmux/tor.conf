source-file ~/.config/tmux/tmux.conf

# ── Visual Isolation: Active Tor Session Borders ──────────────────────────────
set -g pane-active-border-style "fg=red,bg=black"
set -g pane-border-style "fg=yellow,bg=black"

# ── Spawn Tor-routed Shells (with TOR_ACTIVE environment variable) ────────────
bind -n M-s new-window -c "#{pane_current_path}" -n "tor" "TOR_ACTIVE=1 proxychains -q zsh"
bind -n M-v split-window -c "#{pane_current_path}" -h "TOR_ACTIVE=1 proxychains -q zsh"
bind -n M-d split-window -c "#{pane_current_path}" -v "TOR_ACTIVE=1 proxychains -q zsh"

# ── Spawn Leak-Protected Torsocks Shell (Alt-t) ────────────────────────────────
bind -n M-t new-window -c "#{pane_current_path}" -n "torsocks" "TOR_ACTIVE=1 torsocks zsh"

# ── Rotate Tor Circuit / Identity Instantly (Alt-i) ───────────────────────────
bind -n M-i run-shell "printf 'AUTHENTICATE \"\"\nSIGNAL NEWNYM\n' | nc 127.0.0.1 9051 && tmux display-message 'Tor identity rotated successfully!'"

# ── Dynamic Network Security Status Bar ───────────────────────────────────────
set -g status-interval 5
set -g status-right "#[bg=black] #(~/.config/tmux/scripts/network_status.sh) "
