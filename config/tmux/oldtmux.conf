# Shell.
set-option -g default-shell /bin/zsh

# Terminal.
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ',xterm-256color:Tc'

# Undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# Settings.
set -g prefix C-b
set -g prefix2 None
setw -g mode-keys vi
set -g base-index 1
setw -g mouse on
set -s escape-time 0
set -g focus-events on
set -g automatic-rename on
set-option -g set-titles on
set-option -gw xterm-keys on
set -g status-interval 1
set -g renumber-windows on

# Some setup.
unbind h
unbind j
unbind k
unbind l
unbind M-h
unbind M-j
unbind M-k
unbind M-l

# Panes.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"


bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
#bind -n M-S-q kill-pane
bind -n C-S-q confirm-before -p "kill-pane #P? (y/n)" "kill-pane"
bind -n M-v split-window -c "#{pane_current_path}" -h
bind -n M-d split-window -c "#{pane_current_path}" -v
bind -n M-Left resize-pane -L 6
bind -n M-Right resize-pane -R 6
bind -n M-Up resize-pane -U 6
bind -n M-Down resize-pane -D 6
bind -n M-= next-layout

# Windows.
bind -n M-Tab next-window
bind -n M-S-Tab previous-window
#bind -n M-l next-window
#bind -n M-h previous-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n M-0 select-window -t :0
bind -n M-w command-prompt -I "#W" "rename-window '%%'"

# Modes
bind M-[ copy-mode
bind -T copy-mode-vi [ send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi Escape send-keys -X cancel

# Session.
bind -n M-r command-prompt -I "#S" "rename-session '%%'"

# Programs.
bind -n M-m new-window -n "monitor" btop
bind -n M-b new-window -n "github" "gh dash"
bind -n M-g new-window -c "#{pane_current_path}" -n "git" lazygit
bind -n M-s new-window -c "#{pane_current_path}" -n "shell"
bind -n M-f new-window -c "#{pane_current_path}" -n "files" ranger
bind -n M-e new-window -c "#{pane_current_path}" -n "editor" "nvim ."

# Plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'aserowy/tmux.nvim'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'
run '~/.tmux/plugins/tpm/tpm'

# Message style.
set -g message-style "fg=yellow,bg=black"
set -g message-command-style "fg=yellow,bg=black"

# Pane style.
set -g pane-border-style "fg=black"
set -g pane-active-border-style "fg=black"

# Status style.
set -g status-style "fg=#46474a,bg=default"
set -g status-left "#[fg=#249690,bg=default]#[fg=#28292c,bg=#249690] #{session_windows}#[fg=#249690,bg=default]  "
set -g status-right "#[fg=#3f4043,bg=default] #S #[fg=#689E68,bg=default] #[fg=#28292c,bg=#689E68]󱫋 #{session_attached}#[fg=#689E68,bg=default]"
set -g status-left-length 100
set -g status-position top
set -g status-justify left

# Window style.
set -g window-status-style "fg=#3f4043,bg=default"
set -g window-status-format "#[fg=#249690,bg=default]  #[fg=#3f4043,bg=default]#W"
set -g window-status-separator "  "
set -g window-status-current-format "#[fg=#249690,bg=default]  #[fg=#3f4043,bg=default]#W"
