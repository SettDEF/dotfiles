# Raise PipeWire's resampler quality from the default 4 to 10.
# Matters because default.clock.allowed-rates is [ 48000 ], so every
# 44.1 kHz source (most music) is resampled to 48 kHz on the way out.
# Quality 10 = longer sinc filter, lower aliasing. Negligible CPU cost.
stream.properties = {
    resample.quality = 10
}
