bind = Super+Alt, f12, exec, bash -c 'RANDOM_IMAGE=$(find ~/Pictures -type f | grep -v -i "nipple" | grep -v -i "pussy" | shuf -n 1); ACTION=$(notify-send "Test notification" "This notification should contain a random image in your <b>Pictures</b> folder and <a href=\"https://discord.com/app\">Discord</a> <b>icon</b>.\n<i>Flick right to dismiss!</i>" -a "Discord (fake)" -p -h "string:image-path:$RANDOM_IMAGE" -t 6000 -i "discord" -A "openImage=Profile image" -A "action2=Useless button"); [[ $ACTION == *openImage ]] && xdg-open "/var/lib/AccountsService/icons/$USER"' # [hidden]
bind = Super+Alt, Equal, exec, notify-send "Urgent notification" "Ah hell no" -u critical -a 'Hyprland keybind' # [hidden]

##! Session
bindd = Super, L, Lock, global, quickshell:lock # Lock
bindd = Super+Shift, L, Suspend system, global, quickshell:suspendStart # Lock + suspend with popup
# bindl=,switch:on:Lid Switch, exec, systemctl suspend || loginctl suspend # [hidden] Suspend when laptop lid is closed, uncomment if for whatever reason it's not the default behavior
# Lid switch → scripts/lid.sh, gated by the quickshell "Lid" quick-toggle.
# (logind ignores the lid while an external monitor is attached, so this is what
#  turns the built-in screen off in clamshell mode.)
bindl = , switch:on:Lid Switch,  exec, ~/.config/hypr/hyprland/scripts/lid.sh close
bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/hyprland/scripts/lid.sh open
bindd = Ctrl+Shift+Alt+Super, Delete, Shutdown, exec, systemctl poweroff || loginctl poweroff # [hidden] Power off

##! Screen
# Zoom
binde = Super, Minus, exec, ~/.config/hypr/hyprland/scripts/zoom.sh decrease 0.3 # Zoom out
binde = Super, Equal, exec, ~/.config/hypr/hyprland/scripts/zoom.sh increase 0.3 # Zoom in
# Zoom with keypad
binde = Super, code:82, exec, qs -c $qsConfig ipc call zoom zoomOut # [hidden] Zoom out
binde = Super, code:86, exec, qs -c $qsConfig ipc call zoom zoomIn # [hidden] Zoom in
binde = Super, code:82, exec, qs -c $qsConfig ipc call TEST_ALIVE || ~/.config/hypr/hyprland/scripts/zoom.sh decrease 0.1 # [hidden] Zoom out
binde = Super, code:86, exec, qs -c $qsConfig ipc call TEST_ALIVE || ~/.config/hypr/hyprland/scripts/zoom.sh increase 0.1 # [hidden] Zoom in

##! Media
bindl= Super+Shift, N, exec, playerctl next || playerctl position `bc <<< "100 * $(playerctl metadata mpris:length) / 1000000 / 100"` # Next track
bindl= ,XF86AudioNext, exec, playerctl next || playerctl position `bc <<< "100 * $(playerctl metadata mpris:length) / 1000000 / 100"` # [hidden]
bindl= ,XF86AudioPrev, exec, playerctl previous # [hidden]
bind = Super+Shift+Alt, mouse:275, exec, playerctl previous # [hidden]
bind = Super+Shift+Alt, mouse:276, exec, playerctl next || playerctl position `bc <<< "100 * $(playerctl metadata mpris:length) / 1000000 / 100"` # [hidden]
bindl= Super+Shift, B, exec, playerctl previous # Previous track
bindl= Super+Shift, P, exec, playerctl play-pause # Play/pause media
# Play by KEY CODE, not keysym: a keysym bind on XF86AudioPlay made Hyprland 0.56
# swallow the first key typed after a lone Ctrl/Shift/Alt (found by bisecting
# all binds, 2026-10-14). code:172 = XF86AudioPlay.
bindl= ,code:172, exec, playerctl play-pause # [hidden]
bindl= ,XF86AudioPause, exec, playerctl play-pause # [hidden]

##! Apps
bind = SUPER, Return, exec, $run "$HOME/.local/bin/zash -- $HOME/.local/bin/zeit new" "wezterm start --always-new-process -- /home/caesar/.config/tmux/utils/start_terminal.sh" "kitty -e /home/caesar/.config/tmux/utils/start_terminal.sh" "alacritty -e /home/caesar/.config/tmux/utils/start_terminal.sh" "foot -e /home/caesar/.config/tmux/utils/start_terminal.sh"
bind = SUPER, T, exec, $run "$HOME/.local/bin/zash -- $HOME/.local/bin/zeit new" "wezterm start --always-new-process -- /home/caesar/.config/tmux/utils/start_terminal.sh" "kitty -e /home/caesar/.config/tmux/utils/start_terminal.sh" "alacritty -e /home/caesar/.config/tmux/utils/start_terminal.sh"
bind = CTRL ALT, T, exec, $run "$HOME/.local/bin/zash -- $HOME/.local/bin/zeit new" "wezterm start --always-new-process -- /home/caesar/.config/tmux/utils/start_terminal.sh" "kitty -e /home/caesar/.config/tmux/utils/start_terminal.sh"
bind = Super, E, exec, $fileManager # File manager
bind = Super, W, exec, $browser # Browser
bind = Super, C, exec, $codeEditor # Code editor
bind = Ctrl+Super+Shift+Alt, W, exec, $officeSoftware # Office software
bind = Super, X, exec, $textEditor # Text editor
bind = Ctrl+Super, V, exec, $volumeMixer # Volume mixer
bind = Super, I, exec, $settingsApp # Settings app
bind = Ctrl+Shift, Escape, exec, $taskManager # Task manager

# Cursed stuff
## Make window not amogus large
bind = Ctrl+Super, Backslash, resizeactive, exact 640 480 # [hidden]


# noisewatch — freeze the last 90s of machine state the instant the headset
# noise starts. Bound because the noise happens during games, and a capture
# you can only trigger from a terminal is one you will never trigger.
# Remove this block and `systemctl --user disable --now noisewatch` to undo.
# (Super+Ctrl+Shift+N: Super+Shift+N is Next track, and both fired on a skip)
bind = Super+Ctrl+Shift, N, exec, ~/.scripts/apps/hdb630/noisewatch.sh mark "hotkey" && notify-send -a noisewatch "Noise captured" "$(~/.scripts/apps/hdb630/noisewatch.sh report | head -3 | tail -1)"
bind = Super+Shift, D, exec, qs -c $qsConfig ipc call region snap # Draw an area, snap the focused window into it
