env = MOZ_ENABLE_WAYLAND,1
env = GDK_SCALE,1

# Cursor theme and size: the same for the compositor, X11 programs, GTK and Qt.
# install.sh fills these in (the theme the GTK settings name, if installed; the size from
# CURSOR_SIZE, 24 by default) and writes the same into GTK, gsettings, KDE and ~/.icons/default.
env = XCURSOR_THEME,@CURSOR@
env = XCURSOR_SIZE,@CURSOR_SIZE@

# Mesa FPS overlay for the stats HUD — DISABLED 2026-07-31.
#
# The layer's output_file path segfaults the host application: reproduced on mpv
# (exit 139 with it, 124 without; isolated to output_file= specifically, the
# layer alone is harmless). It loads into EVERY Vulkan client, so any GPU-using
# app was at risk. The CSV it exists to produce never contained a single data
# row — only its header — so the feature never worked, and SysStats.qml already
# prefers /dev/shm/mangohud-fps/*.csv anyway.
# env = VK_INSTANCE_LAYERS,VK_LAYER_MESA_overlay
# env = VK_LAYER_MESA_OVERLAY_CONFIG,no_display,fps,output_file=/dev/shm/mesa-fps.csv

# FilmCraft keeps auto-save, crash recovery and logs on storage, not the full root disk.
env = FILMCRAFT_DATA_DIR,~/Videos/FilmCraft

# PhotoCraft always opens its control channel, however it is started (dock, terminal, file
# manager): photocraft-brushset reaches the running app through it to import Procreate brushes.
env = PHOTOCRAFT_CONTROL_PORT,7878
env = PHOTOCRAFT_CONTROL_TOKEN_FILE,~/.config/photocraft-brushset/token
env = PHOTOCRAFT_AUTOMATION_READ_ROOT,~/.cache/photocraft-brushset
