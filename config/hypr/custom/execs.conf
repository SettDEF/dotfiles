# You can make apps auto-start here
# Relevant Hyprland wiki section: https://wiki.hyprland.org/Configuring/Keywords/#executing

# Input method
# exec-once = fcitx5

# Re-apply theme/cursor/mouse settings from KDE System Settings on startup and reload
exec = ~/.config/hypr/hyprland/scripts/sync-kde-theme.sh
# Watch KDE settings and apply theme/mouse/icon changes in real-time
exec-once = ~/.config/hypr/hyprland/scripts/watch-kde-theme.sh

# Start GravityDrop local download companion
exec-once = python3 ~/.scripts/apps/browser/gravity_drop.py

# Watch for monitor layout overlap and notify (Lua, uses socat + notify-send)
exec-once = lua ~/.config/hypr/hyprland/scripts/monitor-overlap-watch.lua

# Warp cursor to centre of newly-focused monitor on workspace switch
# (safety net for cursor:warp_on_change_workspace=2 which missed
# cross-monitor cases under follow_mouse=1 in 0.55.2).
#
# Still required on 0.56: warp_on_change_workspace does NOT fire for the
# Lua `hl.dsp.focus{workspace=N}` path, so without this daemon a workspace
# on the other output gets focused and follow_mouse=1 immediately hands
# focus back to whatever the stationary cursor sits on.
exec-once = lua ~/.config/hypr/hyprland/scripts/cursor-follow-workspace.lua

# Wayland -> X11 clipboard for Proton games (see custom/scripts/clip-x11-bridge).
exec-once = ~/.config/hypr/custom/scripts/clip-x11-bridge
