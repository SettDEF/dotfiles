# Re-enable ACP automatic profile selection for the Sonova HDB 630 USB
# headset ONLY.
#
# ACP is disabled globally (pipewire.conf.d/disable-acp.conf — kept for the
# DJ-808). Without ACP, the HDB 630's output profile is not auto-selected
# at boot (`api.acp.auto-profile` reads "false"), so no sink node is created
# in time — and 52-hdb630-priority.conf can't promote a sink that doesn't
# exist yet. This rule scopes ACP + auto-profile back on for just this card,
# so it always comes up with output:analog-stereo and gets a sink.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-Sonova_Consumer_Hearing_HDB_630.*" }
    ]
    actions = {
      update-props = {
        # ACP on so the consumer profiles (analog-stereo) exist at all…
        api.alsa.use-acp     = true
        # …but auto-profile OFF — left on it auto-picks the raw "Pro Audio"
        # profile. With it off, WirePlumber restores the profile last set
        # (Analog Stereo, pinned below via pactl), which is what playback
        # apps and the saved default sink expect.
        api.acp.auto-profile = false
      }
    }
  }
]
