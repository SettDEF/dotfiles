# No workspace rules. Each workspace number is free to live on any
# monitor.
#
# Behavior:
#   * Super+N goes to workspace N, wherever it currently lives.
#     - If ws N has windows on the other monitor → focus moves there
#       (cursor warps thanks to warp_on_change_workspace=2)
#     - If ws N is empty → workspace is created on whichever monitor
#       you're currently focused on
#   * Workspaces are NOT locked to a monitor. You can drag any window
#     to any monitor, create any number on any monitor.
#   * At boot: each monitor auto-assigns its own workspace (eDP-1 → 1,
#     HDMI-A-1 → 2 typically). Hyprland 0.55 handles this cleanly.
#
# If you ever feel "ws 2 only works on HDMI", that's because ws 2 was
# created on HDMI first. Drag its windows over to eDP and it migrates.
# Or close all ws 2 windows and recreate from eDP — it'll live on eDP
# from then on.
