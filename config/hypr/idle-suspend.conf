# Options for idle-suspend.sh (sourced as shell — KEY=value, no spaces).
# Edit freely; the script falls back to these same defaults if a key is absent.
#
# Check what the guards say right now, without changing anything:
#   ~/.config/hypr/hyprland/scripts/idle-suspend.sh status
#
# Watch its decisions:
#   journalctl -f -t idle-suspend

# ── Which guards can hold sleep off (1 = on, 0 = off) ─────────────────────
GUARD_AUDIO=1           # a sink is actively RUNNING (a film, music, a call)
GUARD_LOAD=1            # sustained CPU work
GUARD_INHIBITORS=1      # something holds a block-mode sleep/idle inhibitor
GUARD_PROCESSES=1       # a named long-running job is present (list below)
GUARD_NETWORK=1         # a large transfer is in flight

# ── Thresholds ────────────────────────────────────────────────────────────

# 1-minute load average above which the machine counts as working.
# This box has 32 threads and idles around 1-2, so 6.0 (~19% busy) catches a
# film or a build without tripping on background noise. Lower it to be more
# protective of running work; raise it to sleep more eagerly.
LOAD_THRESHOLD=6.0

# Extended regex, matched against process NAMES only (not full command lines).
# Add your own tools here — anything that would be ruined by a suspend.
BUSY_PROCESSES='ffmpeg|makepkg|cargo|rustc|cc1plus|ld\.lld|rsync|pacman|paru|yay|dd|handbrake|obs|blender|kdenlive|shotcut|qbittorrent|transmission|steam(cmd)?|wget|curl'

# Sustained throughput across real interfaces, KB/s, above which we wait.
# 200 KB/s ignores background chatter but holds off during a real download.
NET_THRESHOLD_KBPS=200

# ── Deferral behaviour ────────────────────────────────────────────────────

# How often to re-check while waiting for the machine to fall quiet.
# This is what makes it suspend once your film ends, rather than staying awake
# until you touch the keyboard again.
RECHECK_INTERVAL=60

# Give up waiting and suspend anyway after this many seconds.
# 0 = wait indefinitely (never suspend while a guard is tripped).
# e.g. 7200 = "if it is still busy after 2 hours, sleep regardless".
MAX_DEFER_SECONDS=0

# On battery at or below this percentage, ignore every guard and suspend.
# Losing the work to a flat battery is worse than suspending it. 0 disables.
BATTERY_OVERRIDE_PCT=10
