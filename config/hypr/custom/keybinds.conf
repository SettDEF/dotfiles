# --- Global Vim Mode ---
# Toggle Vim Mode (Normal Mode) from global submap
bind = Super, Escape, exec, hyprctl notify 2 1000 "rgb(a5b1c2)" "NORMAL MODE" # Enable Vim Mode
bind = Super, Escape, submap, vim_mode

# Start Vim Normal Mode
submap = vim_mode

# Motions (repeatable on hold)
binde = , h, sendshortcut, , Left, activewindow
binde = , j, sendshortcut, , Down, activewindow
binde = , k, sendshortcut, , Up, activewindow
binde = , l, sendshortcut, , Right, activewindow
binde = , w, sendshortcut, CTRL, Right, activewindow
binde = , b, sendshortcut, CTRL, Left, activewindow
binde = , e, sendshortcut, CTRL, Right, activewindow
binde = , 0, sendshortcut, , Home, activewindow
binde = SHIFT, 4, sendshortcut, , End, activewindow # $
binde = , BackSpace, sendshortcut, , Left, activewindow

# Nested 'g' motions (gg -> top of file)
bind = , g, submap, vim_g_mode
bind = SHIFT, g, sendshortcut, CTRL, End, activewindow # G -> bottom of file

# Enter Visual Mode (Selection Mode)
bind = , v, exec, hyprctl notify 2 1000 "rgb(fc5c65)" "VISUAL MODE"
bind = , v, submap, vim_visual_mode

# Enter Delete Mode (d operator)
bind = , d, exec, hyprctl notify 2 1000 "rgb(eb3b5a)" "DELETE MODE"
bind = , d, submap, vim_delete_mode

# Enter Change Mode (c operator)
bind = , c, exec, hyprctl notify 2 1000 "rgb(fa8231)" "CHANGE MODE"
bind = , c, submap, vim_change_mode

# Actions (Yank, Paste, Undo, Redo, Delete)
bind = , u, sendshortcut, CTRL, z, activewindow
bind = CTRL, r, sendshortcut, CTRL, y, activewindow
bind = , x, sendshortcut, , Delete, activewindow
bind = , p, sendshortcut, CTRL, v, activewindow
bind = , y, exec, hyprctl --batch "dispatch sendshortcut , Home, activewindow; dispatch sendshortcut SHIFT, End, activewindow; dispatch sendshortcut CTRL, c, activewindow" # Yank current line

# Open lines (transitions to insert / global mode)
bind = , o, exec, hyprctl --batch "dispatch sendshortcut , End, activewindow; dispatch sendshortcut , Return, activewindow"
bind = , o, exec, hyprctl notify 2 1000 "rgb(4baf50)" "INSERT MODE"
bind = , o, submap, global

bind = SHIFT, o, exec, hyprctl --batch "dispatch sendshortcut , Home, activewindow; dispatch sendshortcut , Return, activewindow; dispatch sendshortcut , Up, activewindow"
bind = SHIFT, o, exec, hyprctl notify 2 1000 "rgb(4baf50)" "INSERT MODE"
bind = SHIFT, o, submap, global

# Transition to Insert / global Mode (normal typing)
bind = , i, exec, hyprctl notify 2 1000 "rgb(4baf50)" "INSERT MODE" # Insert mode
bind = , i, submap, global

bind = , a, sendshortcut, , Right, activewindow
bind = , a, exec, hyprctl notify 2 1000 "rgb(4baf50)" "INSERT MODE" # Append mode
bind = , a, submap, global

bind = SHIFT, a, sendshortcut, , End, activewindow
bind = SHIFT, a, exec, hyprctl notify 2 1000 "rgb(4baf50)" "INSERT MODE" # Append to line end
bind = SHIFT, a, submap, global

bind = SHIFT, i, sendshortcut, , Home, activewindow
bind = SHIFT, i, exec, hyprctl notify 2 1000 "rgb(4baf50)" "INSERT MODE" # Insert at line start
bind = SHIFT, i, submap, global

# Escape in Normal Mode exits to normal typing
bind = , Escape, exec, hyprctl notify 2 1000 "rgb(4baf50)" "INSERT MODE"
bind = , Escape, submap, global


# --- Vim Nested 'g' Mode ---
submap = vim_g_mode
bind = , g, sendshortcut, CTRL, Home, activewindow # gg -> top of document
bind = , g, submap, vim_mode
bind = , Escape, submap, vim_mode
bind = , catchall, submap, vim_mode


# --- Vim Visual (Selection) Mode ---
submap = vim_visual_mode
binde = , h, sendshortcut, SHIFT, Left, activewindow
binde = , j, sendshortcut, SHIFT, Down, activewindow
binde = , k, sendshortcut, SHIFT, Up, activewindow
binde = , l, sendshortcut, SHIFT, Right, activewindow
binde = , w, sendshortcut, SHIFT CTRL, Right, activewindow
binde = , b, sendshortcut, SHIFT CTRL, Left, activewindow
binde = , 0, sendshortcut, SHIFT, Home, activewindow
binde = SHIFT, 4, sendshortcut, SHIFT, End, activewindow
binde = , BackSpace, sendshortcut, SHIFT, Left, activewindow

# Nested 'g' in Visual Mode
bind = , g, submap, vim_visual_g_mode
bind = SHIFT, g, sendshortcut, SHIFT CTRL, End, activewindow # G -> select to bottom

# Copy / Cut / Delete / Change in Visual Mode
bind = , y, sendshortcut, CTRL, c, activewindow
bind = , y, exec, hyprctl notify 2 1000 "rgb(a5b1c2)" "NORMAL MODE"
bind = , y, submap, vim_mode

bind = , d, sendshortcut, CTRL, x, activewindow
bind = , d, exec, hyprctl notify 2 1000 "rgb(a5b1c2)" "NORMAL MODE"
bind = , d, submap, vim_mode

bind = , x, sendshortcut, CTRL, x, activewindow
bind = , x, exec, hyprctl notify 2 1000 "rgb(a5b1c2)" "NORMAL MODE"
bind = , x, submap, vim_mode

bind = , c, sendshortcut, CTRL, x, activewindow
bind = , c, exec, hyprctl notify 2 1000 "rgb(4baf50)" "INSERT MODE"
bind = , c, submap, global

# Exit visual mode back to normal mode
bind = , v, exec, hyprctl notify 2 1000 "rgb(a5b1c2)" "NORMAL MODE"
bind = , v, submap, vim_mode
bind = , Escape, exec, hyprctl notify 2 1000 "rgb(a5b1c2)" "NORMAL MODE"
bind = , Escape, submap, vim_mode


# --- Vim Visual Nested 'g' Mode ---
submap = vim_visual_g_mode
bind = , g, sendshortcut, SHIFT CTRL, Home, activewindow # gg -> select to top
bind = , g, submap, vim_visual_mode
bind = , Escape, submap, vim_visual_mode
bind = , catchall, submap, vim_visual_mode


# --- Vim Delete Mode ---
submap = vim_delete_mode
bind = , d, exec, hyprctl --batch "dispatch sendshortcut , Home, activewindow; dispatch sendshortcut SHIFT, End, activewindow; dispatch sendshortcut , BackSpace, activewindow; dispatch sendshortcut , Delete, activewindow" # dd -> delete current line
bind = , d, exec, hyprctl notify 2 1000 "rgb(a5b1c2)" "NORMAL MODE"
bind = , d, submap, vim_mode

bind = , w, exec, hyprctl --batch "dispatch sendshortcut SHIFT CTRL, Right, activewindow; dispatch sendshortcut , BackSpace, activewindow" # dw -> delete word forward
bind = , w, exec, hyprctl notify 2 1000 "rgb(a5b1c2)" "NORMAL MODE"
bind = , w, submap, vim_mode

bind = , b, exec, hyprctl --batch "dispatch sendshortcut SHIFT CTRL, Left, activewindow; dispatch sendshortcut , BackSpace, activewindow" # db -> delete word backward
bind = , b, exec, hyprctl notify 2 1000 "rgb(a5b1c2)" "NORMAL MODE"
bind = , b, submap, vim_mode

bind = , h, sendshortcut, , BackSpace, activewindow # dh
bind = , h, exec, hyprctl notify 2 1000 "rgb(a5b1c2)" "NORMAL MODE"
bind = , h, submap, vim_mode

bind = , l, sendshortcut, , Delete, activewindow # dl
bind = , l, exec, hyprctl notify 2 1000 "rgb(a5b1c2)" "NORMAL MODE"
bind = , l, submap, vim_mode

bind = , 0, exec, hyprctl --batch "dispatch sendshortcut SHIFT, Home, activewindow; dispatch sendshortcut , BackSpace, activewindow" # d0
bind = , 0, exec, hyprctl notify 2 1000 "rgb(a5b1c2)" "NORMAL MODE"
bind = , 0, submap, vim_mode

bind = SHIFT, 4, exec, hyprctl --batch "dispatch sendshortcut SHIFT, End, activewindow; dispatch sendshortcut , BackSpace, activewindow" # d$
bind = SHIFT, 4, exec, hyprctl notify 2 1000 "rgb(a5b1c2)" "NORMAL MODE"
bind = SHIFT, 4, submap, vim_mode

bind = , Escape, exec, hyprctl notify 2 1000 "rgb(a5b1c2)" "NORMAL MODE"
bind = , Escape, submap, vim_mode
bind = , catchall, exec, hyprctl notify 2 1000 "rgb(a5b1c2)" "NORMAL MODE"
bind = , catchall, submap, vim_mode


# --- Vim Change Mode ---
submap = vim_change_mode
bind = , c, exec, hyprctl --batch "dispatch sendshortcut , Home, activewindow; dispatch sendshortcut SHIFT, End, activewindow; dispatch sendshortcut , BackSpace, activewindow" # cc -> change current line
bind = , c, exec, hyprctl notify 2 1000 "rgb(4baf50)" "INSERT MODE"
bind = , c, submap, global

bind = , w, exec, hyprctl --batch "dispatch sendshortcut SHIFT CTRL, Right, activewindow; dispatch sendshortcut , BackSpace, activewindow" # cw -> change word forward
bind = , w, exec, hyprctl notify 2 1000 "rgb(4baf50)" "INSERT MODE"
bind = , w, submap, global

bind = , b, exec, hyprctl --batch "dispatch sendshortcut SHIFT CTRL, Left, activewindow; dispatch sendshortcut , BackSpace, activewindow" # cb -> change word backward
bind = , b, exec, hyprctl notify 2 1000 "rgb(4baf50)" "INSERT MODE"
bind = , b, submap, global

bind = , 0, exec, hyprctl --batch "dispatch sendshortcut SHIFT, Home, activewindow; dispatch sendshortcut , BackSpace, activewindow" # c0
bind = , 0, exec, hyprctl notify 2 1000 "rgb(4baf50)" "INSERT MODE"
bind = , 0, submap, global

bind = SHIFT, 4, exec, hyprctl --batch "dispatch sendshortcut SHIFT, End, activewindow; dispatch sendshortcut , BackSpace, activewindow" # c$
bind = SHIFT, 4, exec, hyprctl notify 2 1000 "rgb(4baf50)" "INSERT MODE"
bind = SHIFT, 4, submap, global

bind = , Escape, exec, hyprctl notify 2 1000 "rgb(a5b1c2)" "NORMAL MODE"
bind = , Escape, submap, vim_mode
bind = , catchall, exec, hyprctl notify 2 1000 "rgb(a5b1c2)" "NORMAL MODE"
bind = , catchall, submap, vim_mode


# Reset active submap to global
submap = global




# Settings window — route through quickshell's own toggle instead of
# $settingsApp's raw `qs -p ...`. That launch had no duplicate guard, so
# pressing Super+I twice (or clicking Settings in the sidebar after using the
# keybind) left two windows editing the same config file. The global shortcut
# calls SettingsApp.toggle(), which asks `qs list` what is actually running.
# unbind first: hyprland/keybinds.conf:298 already binds Super+I, and without
# this BOTH bindings would fire.
unbind = Super, I
bind = Super, I, global, quickshell:settingsToggle # Settings app

# On-screen stats overlay (FPS / net / CPU / GPU).
# G for "gauges" — Super+Alt+F was already fullscreenstate.
bind = Super Alt, G, global, quickshell:statsHudToggle # Stats overlay
bind = Super Alt Shift, G, global, quickshell:statsHudSettingsToggle # Stats overlay settings
bind = Super, M, global, quickshell:audioSettingsToggle # Audio device panel
bind = Super Alt, M, global, quickshell:micToggle # Microphone panel (gain, noise, monitoring)
bind = Super Shift, M, global, quickshell:micMute # Mute/unmute the microphone

# Minimize: Hyprland has none, so the window goes to the hidden workspace
# special:minimized. The dock brings it back on click; Super+Shift+Z restores
# the most recently minimized one. See custom/scripts/minimize.sh.
bind = Super, Z, movetoworkspacesilent, special:minimized # Minimize window
bind = Super Shift, Z, exec, ~/.config/hypr/custom/scripts/minimize.sh restore # Restore last minimized window

# Instant replay (gpu-screen-recorder keeps the last 60 s in RAM).
bindl = Alt, F10, exec, ~/.config/quickshell/ii/scripts/videos/replay.sh save # Save the last 60 s (starts the buffer if off)
bindl = Super Alt, F10, exec, ~/.config/quickshell/ii/scripts/videos/replay.sh # Replay buffer on/off

