# MangoHud as a DATA SOURCE for the quickshell HUD, not as an overlay.
#
# The shell's StatsHud tails /dev/shm/mangohud-fps/*.csv and reads the `fps`
# column by NAME (producers disagree on column order). Without this file nothing
# writes those CSVs, so the HUD had no per-app frame rate and correctly showed a
# dash rather than inventing one from the compositor's presentation rate.

# Where the CSV goes. /dev/shm so it never touches the disk — this writes every
# log_interval for as long as a game runs, and root is already at 97%.
output_folder=/dev/shm/mangohud-fps

# Start logging as soon as the game starts, without a keybind.
autostart_log=1

# 500ms: the HUD disowns a reading after 2.5s and treats the file as dead after
# 5s, so this is frequent enough to stay "fresh" with margin, and slow enough
# not to spam a tmpfs.
log_interval=500

# No MangoHud overlay — quickshell draws the numbers. Keeping both would mean
# two FPS counters on screen disagreeing about the same frame.
no_display=1
