#
# Start Menu (modules/ii/startMenu/) — Windows-style launcher above the dock.
# NOTE: Super+Space was previously left "intentionally unbound" here because
# hyprland/keybinds.conf already claims it for cyclenext/bringactivetotop
# (window cycling). That bind is untouched, so Super+Space now ALSO opens
# the Start Menu — both fire on the same press. Flagged for the owner to
# resolve (rebind cyclenext, or rebind the Start Menu) rather than silently
# picked here.
bind = Super, Space, global, quickshell:startMenuToggle
bind = Ctrl, Escape, global, quickshell:startMenuToggle # Start menu (Windows uses this combo)    # Start Menu
bind = Super SHIFT, T, global, quickshell:wallTuneToggle   # WallTune color panel
bind = Super ALT, P, global, quickshell:rogPowerToggle     # ROG power & fan panel
bind = Super ALT, D, global, quickshell:displayToggle      # Display settings (brightness, temp, saturation)
bind = Super ALT, A, global, quickshell:deviceToolsToggle   # Automations — rules that fire when hardware/state changes
bind = Super ALT, B, global, quickshell:torrentsToggle      # Torrents — qBittorrent panel
bind = Super ALT, C, global, quickshell:captionsToggle      # Live captions — speech on screen
bind = Super SHIFT, D, global, quickshell:screenDrawToggle     # Screen draw — open sidebar Draw tab
