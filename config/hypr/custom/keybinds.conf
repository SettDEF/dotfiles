##! Recording
# tinct-cast: one key starts a recording of the screen you are on (with the
# recording bar on another monitor), the same key stops it — SIGINT is what
# the bar's own stop button sends, so the recording is finished and saved.
bind = Super+Ctrl+Shift, R, exec, pkill -INT -x tinct-cast || ~/.local/bin/tinct-cast record --bar --monitor focused # tinct-cast: start / stop recording
bind = Super+Ctrl+Shift, E, exec, ~/.local/bin/tinct-cast-edit # tinct-cast: open the editor
bind = Super+Shift, E, exec, ~/.scripts/apps/zett/zett-edit # zett: edit the clipboard (each save copies it back)


