# (HDMI-A-1 line added manually — re-run nwg-displays to regenerate both.)

# eDP-1: 180Hz panel. vrr,2 = variable refresh ONLY when a fullscreen client
# is on this output. Scoped per-monitor instead of via global misc:vrr so the
# 60Hz HDMI doesn't get pulled into a mixed-mode refresh cycle.
monitor=desc:Tianma Microelectronics Ltd. TL134ADXP03,2560x1600@180.0,0x0,1.6,vrr,0
# External monitor pinned to an explicit mode + scale so it stops
# re-negotiating via the `monitor=,preferred,auto,1` fallback (that
# re-negotiation forced a full dual-monitor layout recalc).
#
# Position x=1600 — now EXACT, not a safety margin.
#   The scale above was 1.67, which put eDP-1's logical width at
#   2560/1.67 = 1532.934. Hyprland rounds that (`(pixelSize/scale).round()`,
#   Monitor.cpp:1081), so no surface landed on a whole pixel and everything
#   was resampled — which is what "the display looks soft" actually was.
#   Placing the external at 1534 then tripped the "monitor overlaps" overlay
#   on 0.55.2, so x=1600 was chosen as a margin past any plausible rounding,
#   at the cost of ~67 logical px of seamless cursor travel.
#
#   At scale 1.6 the panel is exactly 1600x1000, so x=1600 stops being a
#   margin and becomes the adjacent edge: no rounding, no gap, no overlap,
#   and the cursor crosses seamlessly again. Measured both ways — 1.67 gives
#   1532.93x958.08, 1.6 gives 1600.00x1000.00.
#
#   Keep any future scale on this panel to one that divides 2560x1600
#   evenly: 1.0, 1.25, 1.6, 2.0. 1.5 and 1.75 do not.
#
# vrr,0 keeps it locked at 60Hz. desc-based match so the rule applies
# whenever this specific monitor enumerates, regardless of port name
# or boot timing — `HDMI-A-1` as a literal raced DRM enumeration at
# greetd→uwsm→Hyprland handoff and triggered "monitor not present".
monitor=desc:AOC 2590G5,1920x1080@60,1600x0,1,vrr,0

# Panasonic TV over HDMI. It had NO rule: the AOC line above is desc-matched
# to a different monitor, so this one fell through to `preferred` — and its
# EDID lists 1920x1080@50 first, so it ran at 50Hz while 60Hz sat in the mode
# list. Pinned explicitly rather than with `highrr`, for the same reason the
# AOC is pinned: an explicit mode stops the re-negotiation that forces a full
# dual-monitor layout recalc.
monitor=desc:Panasonic Industry Company Panasonic-TV,1920x1080@60,1600x0,1,vrr,0
