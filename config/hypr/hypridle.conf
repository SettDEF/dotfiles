$lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lock")' & pidof qs quickshell hyprlock || hyprlock
# $lock_cmd = pidof hyprlock || hyprlock
# Guarded suspend: hypridle only knows about INPUT idle, so a long render,
# build, download or film (none of which touch the mouse) used to get the
# machine suspended mid-work. The wrapper re-checks that the box is genuinely
# idle — no audio playing, load below threshold, no block-mode sleep inhibitor —
# and otherwise runs exactly this same command. It can only make sleep less
# likely, never more. Reasons land in the journal under tag `idle-suspend`.
# Absolute path on purpose: `~` is only expanded if the command goes through a
# shell, and a silently-unresolvable path here would mean the machine never
# suspends again.
$suspend_cmd = /home/caesar/.config/hypr/hyprland/scripts/idle-suspend.sh
$suspend_cancel = /home/caesar/.config/hypr/hyprland/scripts/idle-suspend.sh cancel

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'; hyprctl dispatch 'hl.dsp.global("quickshell:lockFocus")'
    inhibit_sleep = 3
}

listener {
    timeout = 305 # just after the screen goes off (300): no lock while it is still on
    on-timeout = loginctl lock-session
}

listener {
    timeout = 300 # 5mins
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}

listener {
    timeout = 900 # 15mins
    on-timeout = $suspend_cmd
    # on-resume is essential, not cosmetic: if a guard tripped, the script is
    # still polling in the background waiting for the machine to fall quiet.
    # Without this, coming back to the keyboard would leave that poller armed
    # and it could suspend the machine while you are using it.
    on-resume = $suspend_cancel
}

listener {
    on-resume = hyprctl dispatch 'hl.dsp.focus({ window = "class:Minimeters" })'
}
