# Force the Sonova HDB 630 USB headset to be the default sink whenever
# it's present, even if it was enumerated AFTER the laptop's internal
# sinks at boot.  Bumps node.priority.driver / .session above the
# defaults of internal sinks (which are around 1000–1100) and tags it
# with priority.session so WirePlumber's default-node selector picks it.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb-Sonova_Consumer_Hearing_HDB_630.*" }
    ]
    actions = {
      update-props = {
        priority.driver  = 2000
        priority.session = 2000
        # Don't suspend the device — re-routing on resume can fail to
        # auto-switch back, leaving audio on the laptop sink.
        session.suspend-timeout-seconds = 0
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.usb-Sonova_Consumer_Hearing_HDB_630.*" }
    ]
    actions = {
      update-props = {
        priority.driver  = 2000
        priority.session = 2000
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
