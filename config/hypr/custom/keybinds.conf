# See https://wiki.hyprland.org/Configuring/Binds/
#!
##! Power
# Physical power button: lock the session and blank the screen instead of
# shutting down. `bindl` fires even while locked. Requires logind to stop
# handling the key itself — see /etc/systemd/logind.conf.d/10-powerkey.conf
# (HandlePowerKey=ignore). Any input wakes the panels back to the lock screen.
bindl = , XF86PowerOff, exec, loginctl lock-session && sleep 0.5 && hyprctl dispatch 'hl.dsp.dpms("off")' # Power button: screen off + lock

